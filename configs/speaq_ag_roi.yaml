MODEL:
  META_ARCHITECTURE: "IterativeRelationDetr"
  WEIGHTS: ""  # 使用 SAM3 从头训练，无需 detectron2 预训练权重
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  MASK_ON: False
  DETR:
    NAME: "IterativeRelationDETR"
    TRANSFORMER: "IterativeRelationTransformer"
    CRITERION: "IterativeRelationCriterion"
    MATCHER: "SpeaQHungarianMatcher"
    NUM_OBJECT_QUERIES: 100
    NUM_RELATION_QUERIES: 100
    NUM_CLASSES: 36
    NUM_RELATION_CLASSES: 26
    OBJECT_DEC_LAYERS: 6
    REWEIGHT_RELATIONS: True
    REWEIGHT_REL_EOS_COEF: 0.1
    NO_OBJECT_WEIGHT: 0.1
    PERSON_CLASS_WEIGHT: 1.0
    PERSON_SCORE_SCALE: 200.0
    PERSON_CLASS_INDEX: 0
    NO_REL_WEIGHT: 0.1
  OBJ_SPLIT:
    ENABLED: False
  SAM3:
    ENABLED: True
    CHECKPOINT_PATH: "sam3/weights/sam3.pt"
    IMAGE_SIZE: 1008
    FEATURE_DIM: 256
    CHANNEL_REPEAT: 1
    FREEZE: True
    DEVICE: "cuda"
    TARGET_STRIDE: 28
    USE_FPN: False
    FPN_STRIDES: [7, 14, 28]
    USE_BACKBONE_FPN: True
    MULTISCALE_MERGE: "last"
  ROI_REFINE:
    ENABLED: True
    STRIDE: 14
    POOL_SIZE: 7
    SMALL_AREA_THRESH: 1.0
    DETACH_BOXES: True
    USE_GATE: True
    LOSS_ENABLED: True
    LOSS_WEIGHT: 1.0
    APPLY_TO: "small_only"
  TEMPORAL:
    ENABLED: False
    EVAL_ENABLED: False
    MODE: "object_query_memory_v1"
    NUM_MEMORY_SLOTS: 32
    MEMORY_TOPK: 16
    MEMORY_SCORE_THRESH: 0.5
    MEMORY_IOU_THRESH: 0.5
    MEMORY_MAX_MISS: 2
    DETACH_MEMORY: True

DATASETS:
  TYPE: "ACTION GENOME"
  TRAIN: ("AG_train",)
  TEST: ("AG_val",)
  ACTION_GENOME:
    ANNOTATIONS: "dataset/annotations"
    FRAMES: "dataset/frames"
    VIDEOS: "dataset/videos"
    FILTER_EMPTY_RELATIONS: True
    FILTER_DUPLICATE_RELATIONS: True
    FILTER_NON_OVERLAP: False
    FORMAT_VID_WISE: True
    NUM_VIDEOS_TRAIN: -1
    NUM_VIDEOS_VAL: 400
    VAL_SET_RANDOMIZED: False

SOLVER:
  IMS_PER_BATCH: 8
  MAX_EPOCH: 0
  BASE_LR: 0.0001
  STEPS: (80000, 120000)
  MAX_ITER: 160000
  WARMUP_FACTOR: 0.001
  WARMUP_ITERS: 3000
  WEIGHT_DECAY: 0.0001
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.05
  CHECKPOINT_PERIOD: 5000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.1
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True

INPUT:
  MIN_SIZE_TRAIN: (1008,)
  MAX_SIZE_TRAIN: 1008
  MIN_SIZE_TEST: 1008
  MAX_SIZE_TEST: 1008
  CROP:
    ENABLED: False
    TYPE: "absolute_range"
    SIZE: (360, 640)
  FORMAT: "RGB"

TEST:
  EVAL_PERIOD: 2000
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False
  NUM_WORKERS: 8

VERSION: 2
