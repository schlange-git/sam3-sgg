MODEL:
  META_ARCHITECTURE: IterativeRelationDetr
  WEIGHTS: ''
  PIXEL_MEAN:
  - 123.675
  - 116.28
  - 103.53
  PIXEL_STD:
  - 58.395
  - 57.12
  - 57.375
  MASK_ON: false
  DETR:
    NAME: IterativeRelationDETR
    TRANSFORMER: IterativeRelationTransformer
    CRITERION: IterativeRelationCriterion
    MATCHER: SpeaQHungarianMatcher
    NUM_OBJECT_QUERIES: 100
    NUM_RELATION_QUERIES: 100
    NUM_CLASSES: 36
    NUM_RELATION_CLASSES: 26
    OBJECT_DEC_LAYERS: 6
    REWEIGHT_RELATIONS: true
    REWEIGHT_REL_EOS_COEF: 0.1
    NO_OBJECT_WEIGHT: 0.1
    PERSON_CLASS_WEIGHT: 1.0
    PERSON_SCORE_SCALE: 300.0
    PERSON_CLASS_INDEX: 0
    NO_REL_WEIGHT: 0.1
    BOX_LOSS_TYPE: giou
    USE_CORNER_LOSS: false
    CORNER_LOSS_WEIGHT: 0.5
  OBJ_SPLIT:
    ENABLED: false
  SAM3:
    ENABLED: true
    CHECKPOINT_PATH: sam3/weights/sam3.pt
    IMAGE_SIZE: 1008
    FEATURE_DIM: 256
    CHANNEL_REPEAT: 1
    FREEZE: true
    DEVICE: cuda
    TARGET_STRIDE: 28
    USE_FPN: false
    FPN_STRIDES:
    - 7
    - 14
    - 28
    USE_BACKBONE_FPN: true
    MULTISCALE_MERGE: last
  ROI_REFINE:
    ENABLED: false
    STRIDE: 14
    POOL_SIZE: 7
    SMALL_AREA_THRESH: 1.0
    DETACH_BOXES: true
    USE_GATE: true
    LOSS_ENABLED: true
    LOSS_WEIGHT: 1.0
    APPLY_TO: small_only
    ONLY_ROI_CLS: false
  TEMPORAL:
    ALPHA_INIT: 0.7
    CACHE_DECAY: 0.85
    CACHE_MATCH_IOU: 0.5
    CACHE_MAX_AGE: 8
    CACHE_MAX_MISS: 2
    CACHE_MAX_SIZE: 32
    CACHE_MIN_SCORE: 0.2
    CACHE_RESET_ON_VIDEO_SWITCH: true
    CACHE_SCORE_THRESH: 0.5
    DETACH_MEMORY: true
    ENABLED: true
    EVAL_ENABLED: true
    INJECT_METHOD: add_first_k
    MEMORY_IOU_THRESH: 0.5
    MEMORY_MAX_MISS: 2
    MEMORY_SCORE_THRESH: 0.5
    MEMORY_TOPK: 16
    MODE: object_query_memory_v1
    NON_KEY_RUN_OBJECT_ONLY: true
    NON_KEY_SKIP_EVAL: true
    NON_KEY_SKIP_LOSS: true
    NUM_MEMORY_SLOTS: 32
DATASETS:
  TYPE: ACTION GENOME
  TRAIN: ("AG_train",)
  TEST: ("AG_val",)
  ACTION_GENOME:
    ANNOTATIONS: dataset/annotations
    FRAMES: dataset/frames
    VIDEOS: dataset/videos
    FILTER_EMPTY_RELATIONS: true
    FILTER_DUPLICATE_RELATIONS: true
    FILTER_NON_OVERLAP: false
    FORMAT_VID_WISE: true
    NUM_VIDEOS_TRAIN: -1
    NUM_VIDEOS_VAL: 400
    VAL_SET_RANDOMIZED: false
SOLVER:
  IMS_PER_BATCH: 24
  MAX_EPOCH: 0
  BASE_LR: 0.0001
  STEPS: (40000, 120000)
  MAX_ITER: 160000
  WARMUP_FACTOR: 0.001
  WARMUP_ITERS: 3000
  WEIGHT_DECAY: 0.0001
  OPTIMIZER: ADAMW
  BACKBONE_MULTIPLIER: 0.05
  CHECKPOINT_PERIOD: 5000
  CLIP_GRADIENTS:
    ENABLED: true
    CLIP_TYPE: full_model
    CLIP_VALUE: 0.1
    NORM_TYPE: 2.0
  AMP:
    ENABLED: true
INPUT:
  MIN_SIZE_TRAIN: (1008,)
  MAX_SIZE_TRAIN: 1008
  MIN_SIZE_TEST: 1008
  MAX_SIZE_TEST: 1008
  CROP:
    ENABLED: false
    TYPE: absolute_range
    SIZE: (360, 640)
  FORMAT: RGB
TEST:
  EVAL_PERIOD: 20000
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: false
  NUM_WORKERS: 8
VERSION: 2
