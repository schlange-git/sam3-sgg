MODEL:
  META_ARCHITECTURE: "IterativeRelationDetr"
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-101.pkl"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  MASK_ON: False
  RESNETS:
    DEPTH: 101
    STRIDE_IN_1X1: False
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  DETR:
    NAME: "IterativeRelationDETR"
    TRANSFORMER: "IterativeRelationTransformer"
    CRITERION: "IterativeRelationCriterion"
    MATCHER: "SpeaQHungarianMatcher"
    NUM_OBJECT_QUERIES: 100
    NUM_RELATION_QUERIES: 100
    # 与 ANNOTATIONS 下 object_classes.txt / relationship_classes.txt 行数一致（当前为 36/26）。训练时会自动覆盖；+1 no-object/no-relation 在模型内部处理。
    NUM_CLASSES: 36
    NUM_RELATION_CLASSES: 26
    OBJECT_DEC_LAYERS: 6
    REWEIGHT_RELATIONS: True
    REWEIGHT_REL_EOS_COEF: 0.1
    NO_OBJECT_WEIGHT: 0.1
    PERSON_CLASS_WEIGHT: 1.0
    NO_REL_WEIGHT: 0.1
  OBJ_SPLIT:
    ENABLED: False
    # 以下集合需要互斥并完整覆盖 [0, NUM_CLASSES-1]，仅在 ENABLED=True 时生效
    REGULAR_CLASSES: []
    SMALL_SHARED_CLASSES: []
    FINE_GROUPS: []
    FINE_GROUP_NAMES: []
    FINE_GROUPS_USE_UPSAMPLE: []
    SMALL_SHARED_USE_UPSAMPLE: False
    USE_TEMP_SCALING: False
    AUX_LOSS_WEIGHT_REG: 0.0
    AUX_LOSS_WEIGHT_SMALL: 0.0
    AUX_LOSS_WEIGHT_FINE: 0.0
  SAM3:
    ENABLED: False
    USE_PRECOMPUTED: False
    # SAM3 权重：放 sam3/weights/sam3.pt，或设为本项（相对项目根/绝对路径）。缺失时会尝试 HuggingFace 下载。
    CHECKPOINT_PATH: "sam3/weights/sam3.pt"
    # SAM3输入图像尺寸
    IMAGE_SIZE: 1008
    # SAM3输出特征维度（需要与DETR的HIDDEN_DIM匹配）
    FEATURE_DIM: 256
    # 通道重复倍数（1表示不重复）
    CHANNEL_REPEAT: 1
    # 是否冻结SAM3参数（False时参与反向传播做微调）。
    # 通过脚本环境变量 SAM3_UNFREEZE_ITER 实现前N iter冻结再解冻：>0 时前 N iter 冻结，之后自动解冻继续训练到 MAX_ITER。
    FREEZE: True
    # SAM3运行的设备（通常与MODEL.DEVICE相同）
    DEVICE: "cuda"
    # 如果使用预计算的特征图，设置特征图目录
    FEATUREMAP_DIR: ""
    # 控制特征图粗细：16 比 32 更细粒度
    TARGET_STRIDE: 32
    # 打开多尺度特征
    USE_FPN: False
    # FPN 目标步长（从细到粗）
    FPN_STRIDES: [8, 16, 32]
    # 优先使用 SAM3 原生 backbone_fpn 多尺度输出
    USE_BACKBONE_FPN: False
    # 多尺度融合策略：last(不融合) / sum(相加融合) / concat(拼接融合)
    MULTISCALE_MERGE: "sum"
  TEMPORAL:
    ENABLED: False
    EVAL_ENABLED: False
    MODE: "object_query_memory_v1"
    NUM_MEMORY_SLOTS: 32
    MEMORY_TOPK: 16
    MEMORY_SCORE_THRESH: 0.5
    MEMORY_IOU_THRESH: 0.5
    MEMORY_MAX_MISS: 2
    DETACH_MEMORY: True

DATASETS:
  TYPE: "ACTION GENOME"
  ACTION_GENOME:
    FORMAT_VID_WISE: True
  # 评估时关系类别数需与 relationship_classes.txt 一致（不含 +1 background）
  ROI_SCENEGRAPH_HEAD:
    NUM_CLASSES: 26

DATASETS:
  TYPE: "ACTION GENOME"
  TRAIN: ("AG_train",)
  TEST: ("AG_val",)
  ACTION_GENOME:
    ANNOTATIONS: "/home/shi/桌面/abschluss/sgg/dataset/actiongenome/annotations"
    FRAMES: "/home/shi/桌面/abschluss/sgg/dataset/actiongenome/frames"
    VIDEOS: "/home/shi/桌面/abschluss/sgg/dataset/actiongenome/videos"
    FILTER_EMPTY_RELATIONS: True
    FILTER_DUPLICATE_RELATIONS: True
    FILTER_NON_OVERLAP: False
    FORMAT_VID_WISE: True
    NUM_VIDEOS_TRAIN: -1
    NUM_VIDEOS_VAL: 400
    VAL_SET_RANDOMIZED: False

SOLVER:
  IMS_PER_BATCH: 8
  # 以 epoch 为主导：每个 epoch 遍历全部帧，训练总长度由 MAX_EPOCH 决定
  MAX_EPOCH: 0
  BASE_LR: 0.0001
  STEPS: (112000, 144000)
  MAX_ITER: 160000
  WARMUP_FACTOR: 0.001
  WARMUP_ITERS: 3000
  WEIGHT_DECAY: 0.0001
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.05
  CHECKPOINT_PERIOD: 2000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.1
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True

INPUT:
  # 固定为1008以匹配SAM3.IMAGE_SIZE，避免双重resize导致的对齐问题
  # SAM3 backbone会强制resize到IMAGE_SIZE(1008)，所以这里设为固定值确保一致性
  # 注意：必须使用tuple格式 (1008,) 以匹配Detectron2的默认类型
  MIN_SIZE_TRAIN: (1008,)
  MAX_SIZE_TRAIN: 1008
  # 测试阶段也使用固定尺寸1008，与训练和SAM3.IMAGE_SIZE一致
  # 注意：MIN_SIZE_TEST 和 MAX_SIZE_TEST 在 INPUT 下，使用 int 格式即可（不需要 tuple）
  MIN_SIZE_TEST: 1008
  MAX_SIZE_TEST: 1008
  # 关闭CROP以避免额外的resize/crop操作破坏对齐
  CROP:
    ENABLED: False
    TYPE: "absolute_range"
    SIZE: (360, 640)
  FORMAT: "RGB"

TEST:
  EVAL_PERIOD: 20000
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False
  NUM_WORKERS: 8

VERSION: 2
