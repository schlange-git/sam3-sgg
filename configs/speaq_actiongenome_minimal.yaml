MODEL:
  META_ARCHITECTURE: "IterativeRelationDetr"
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-101.pkl"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  MASK_ON: False
  RESNETS:
    DEPTH: 101
    STRIDE_IN_1X1: False
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  DETR:
    NAME: "IterativeRelationDETR"
    TRANSFORMER: "IterativeRelationTransformer"
    CRITERION: "IterativeRelationCriterion"
    MATCHER: "SpeaQHungarianMatcher"
    NUM_OBJECT_QUERIES: 100
    NUM_RELATION_QUERIES: 100
    # 与 ANNOTATIONS 下 object_classes.txt / relationship_classes.txt 行数一致（当前为 36/26）。训练时会自动覆盖；+1 no-object/no-relation 在模型内部处理。
    NUM_CLASSES: 36
    NUM_RELATION_CLASSES: 26
    OBJECT_DEC_LAYERS: 6
    REWEIGHT_RELATIONS: True
    REWEIGHT_REL_EOS_COEF: 0.1
    NO_OBJECT_WEIGHT: 0.1
    NO_REL_WEIGHT: 0.1
  SAM3:
    ENABLED: True
    USE_PRECOMPUTED: False
    # SAM3 权重：放 sam3/weights/sam3.pt，或设为本项（相对项目根/绝对路径）。缺失时会尝试 HuggingFace 下载。
    CHECKPOINT_PATH: "sam3/weights/sam3.pt"
    # SAM3输入图像尺寸
    IMAGE_SIZE: 1008
    # SAM3输出特征维度（需要与DETR的HIDDEN_DIM匹配）
    FEATURE_DIM: 256
    # 通道重复倍数（1表示不重复）
    CHANNEL_REPEAT: 1
    # 是否冻结SAM3参数（True时不参与反向传播，节省显存）
    FREEZE: True
    # SAM3运行的设备（通常与MODEL.DEVICE相同）
    DEVICE: "cuda"
    # 如果使用预计算的特征图，设置特征图目录
    FEATUREMAP_DIR: "data/featuremaps"
  # 评估时关系类别数需与 relationship_classes.txt 一致（不含 +1 background）
  ROI_SCENEGRAPH_HEAD:
    NUM_CLASSES: 26

DATASETS:
  TYPE: "ACTION GENOME"
  TRAIN: ("AG_train",)
  TEST: ("AG_val",)
  ACTION_GENOME:
    ANNOTATIONS: "/home/shi/桌面/abschluss/sgg/dataset/actiongenome/annotations"
    FRAMES: "/home/shi/桌面/abschluss/sgg/dataset/actiongenome/frames"
    VIDEOS: "/home/shi/桌面/abschluss/sgg/dataset/actiongenome/videos"
    FILTER_EMPTY_RELATIONS: True
    FILTER_DUPLICATE_RELATIONS: True
    FILTER_NON_OVERLAP: False
    FORMAT_VID_WISE: True
    NUM_VIDEOS_TRAIN: -1
    NUM_VIDEOS_VAL: 400
    VAL_SET_RANDOMIZED: False

SOLVER:
  IMS_PER_BATCH: 6
  BASE_LR: 0.0001
  STEPS: (35000, 45000)
  MAX_ITER: 50000
  WARMUP_FACTOR: 0.001
  WARMUP_ITERS: 1000
  WEIGHT_DECAY: 0.0001
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.1
  CHECKPOINT_PERIOD: 1000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.1
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True

INPUT:
  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704)
  CROP:
    ENABLED: True
    TYPE: "absolute_range"
    SIZE: (360, 640)
  FORMAT: "RGB"

TEST:
  EVAL_PERIOD: 5000

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False
  NUM_WORKERS: 8

VERSION: 2
